<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes - File Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        teal: '#008080',
                        silver: '#c0c0c0',
                        gray: '#808080',
                        navy: '#000080',
                        win_black: '#000000',
                        win_white: '#ffffff',
                    },
                    fontFamily: {
                        sans: ['"MS Sans Serif"', 'Tahoma', 'sans-serif'],
                        mono: ['"Courier New"', 'monospace'],
                    },
                    boxShadow: {
                        'win95-outset': 'inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #ffffff',
                        'win95-inset': 'inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'MS Sans Serif', 'Tahoma', sans-serif;
            -webkit-font-smoothing: none;
            image-rendering: pixelated;
        }
        .win-btn:active {
            box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
            padding-top: 2px;
            padding-left: 2px;
        }
        .file-item:hover {
            background-color: #000080;
            color: white;
        }
        .file-item:hover .file-icon {
            filter: brightness(1.2);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <!-- Main Window (Maximizedish) -->

            <div class="flex items-center gap-2">

                <span class="text-white font-bold text-sm tracking-wide">C:\我的文档\文章</span>
            </div>
            <div class="flex gap-1">
                <button onclick="window.location.href='index.html'" class="w-4 h-4 bg-silver shadow-win95-outset flex items-center justify-center active:shadow-win95-inset text-[10px] font-bold pb-1" title="最小化">_</button>
                <button class="w-4 h-4 bg-silver shadow-win95-outset flex items-center justify-center active:shadow-win95-inset text-[10px] font-bold pb-1" title="最大化">□</button>
                <button onclick="window.location.href='index.html'" class="w-4 h-4 bg-silver shadow-win95-outset flex items-center justify-center active:shadow-win95-inset text-[10px] font-bold pb-1" title="关闭">×</button>
            </div>
        </div>

        <!-- Menu Bar -->
        <div class="flex px-1 py-1 text-sm select-none border-b border-gray-300">
            <div class="px-2 py-1 hover:bg-navy hover:text-white cursor-pointer"><span class="underline decoration-1 underline-offset-2">文</span>件(F)</div>
            <div class="px-2 py-1 hover:bg-navy hover:text-white cursor-pointer"><span class="underline decoration-1 underline-offset-2">编</span>辑(E)</div>
            <div class="px-2 py-1 hover:bg-navy hover:text-white cursor-pointer"><span class="underline decoration-1 underline-offset-2">查</span>看(V)</div>
            <div class="px-2 py-1 hover:bg-navy hover:text-white cursor-pointer"><span class="underline decoration-1 underline-offset-2">转</span>到(G)</div>
            <div class="px-2 py-1 hover:bg-navy hover:text-white cursor-pointer"><span class="underline decoration-1 underline-offset-2">收</span>藏(A)</div>
            <div class="px-2 py-1 hover:bg-navy hover:text-white cursor-pointer"><span class="underline decoration-1 underline-offset-2">帮</span>助(H)</div>
        </div>

        <!-- Address Bar -->
        <div class="flex items-center gap-2 px-2 py-1 border-b border-gray-300">
            <span class="text-xs">地址(D)</span>
            <div class="flex-1 bg-white shadow-win95-inset px-2 py-0.5 text-sm flex items-center gap-2">
                <i class="fa fa-folder text-yellow-400"></i>
                C:\我的文档\文章
            </div>
        </div>

        <!-- Content Area (Grid) -->
        <div class="flex-1 bg-white shadow-win95-inset m-1 p-4 overflow-y-auto min-h-0">
            <div class="grid grid-cols-[repeat(auto-fill,minmax(100px,1fr))] gap-4">
                
                <!-- File Item -->

                    </div>
                    <span class="text-xs text-center break-words w-full">Java Tech Stack.html</span>
                </a>

                <!-- File Item -->
                <a href="notes/spring-boot-rest-api.html" class="file-item flex flex-col items-center gap-1 p-2 cursor-pointer border border-transparent hover:border-dotted hover:border-gray-400">
                    <div class="file-icon text-4xl text-blue-400">
                        <i class="fa fa-file-text-o"></i>
                    </div>
                    <span class="text-xs text-center break-words w-full">Spring Boot REST.html</span>
                </a>

                <!-- File Item -->
                <a href="notes/jpa-quickstart.html" class="file-item flex flex-col items-center gap-1 p-2 cursor-pointer border border-transparent hover:border-dotted hover:border-gray-400">
                    <div class="file-icon text-4xl text-blue-400">
                        <i class="fa fa-file-text-o"></i>
                    </div>
                    <span class="text-xs text-center break-words w-full">JPA Quickstart.html</span>
                </a>

                <!-- File Item -->
                <a href="notes/hello-world.html" class="file-item flex flex-col items-center gap-1 p-2 cursor-pointer border border-transparent hover:border-dotted hover:border-gray-400">
                    <div class="file-icon text-4xl text-blue-400">
                        <i class="fa fa-file-text-o"></i>
                    </div>
                    <span class="text-xs text-center break-words w-full">Hello World.html</span>

                <!-- File Item -->
                <a href="notes/idea-shortcuts.html" class="file-item flex flex-col items-center gap-1 p-2 cursor-pointer border border-transparent hover:border-dotted hover:border-gray-400">
                    <div class="file-icon text-4xl text-blue-400">
                        <i class="fa fa-file-text-o"></i>
                    </div>
                    <span class="text-xs text-center break-words w-full">IDEA Shortcuts.html</span>
                </a>

                <!-- File Item -->
                <a href="notes/variables-and-types.html" class="file-item flex flex-col items-center gap-1 p-2 cursor-pointer border border-transparent hover:border-dotted hover:border-gray-400">
                    <div class="file-icon text-4xl text-blue-400">
                        <i class="fa fa-file-text-o"></i>
                    </div>
                    <span class="text-xs text-center break-words w-full">Variables.html</span>
                </a>

                <!-- File Item -->
                <a href="notes/maven-dependency-management.html" class="file-item flex flex-col items-center gap-1 p-2 cursor-pointer border border-transparent hover:border-dotted hover:border-gray-400">
                    <div class="file-icon text-4xl text-blue-400">
                        <i class="fa fa-file-text-o"></i>
                    </div>
                    <span class="text-xs text-center break-words w-full">Maven Guide.html</span>
                </a>

                <!-- File Item -->
                <a href="notes/java-exception-handling.html" class="file-item flex flex-col items-center gap-1 p-2 cursor-pointer border border-transparent hover:border-dotted hover:border-gray-400">

        <!-- Status Bar -->

        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="absolute bottom-10 left-1 bg-silver shadow-win95-outset w-48 flex flex-col z-[60] hidden">
        <div class="flex">
            <div class="w-8 bg-navy text-white flex items-end justify-center pb-2 relative">
                 <span class="transform -rotate-90 text-lg font-bold whitespace-nowrap tracking-widest mb-4">RetroOS</span>
            </div>
            <div class="flex-1 py-1 text-sm">
                 <div class="hover:bg-navy hover:text-white px-2 py-1 flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                     <i class="fa fa-desktop"></i> 桌面
                 </div>
                 <div class="hover:bg-navy hover:text-white px-2 py-1 flex items-center gap-2 cursor-pointer" onclick="window.location.href='all-notes.html'">
                     <i class="fa fa-folder-open"></i> 文章

                     <i class="fa fa-cog"></i> 分类
                 </div>
                 <div class="hover:bg-navy hover:text-white px-2 py-1 flex items-center gap-2 cursor-pointer" onclick="window.open('https://github.com', '_blank')">
                     <i class="fa fa-globe"></i> Internet
                 </div>
                 <div class="border-t border-gray-400 border-b border-white my-1"></div>
                 <div class="hover:bg-navy hover:text-white px-2 py-1 flex items-center gap-2 cursor-pointer" onclick="shutdown()">
                     <i class="fa fa-power-off"></i> 关闭系统...
                 </div>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <footer class="h-10 bg-silver shadow-win95-outset flex items-center px-1 py-1 gap-1 z-50">
        <button id="start-btn" onclick="toggleStartMenu()" class="flex items-center gap-1 px-2 py-1 bg-silver shadow-win95-outset active:shadow-win95-inset font-bold text-sm win-btn">
            <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" class="w-5 h-5" alt="win">
            开始
        </button>
        <!-- Active Window Tab -->
        <div class="flex-1 flex justify-start">
            <div class="px-4 py-1 bg-silver shadow-win95-inset font-bold text-sm flex items-center gap-2 w-48 bg-gray/20">
                <i class="fa fa-folder-open"></i> 我的文档
            </div>
        </div>
        <div class="px-3 py-1 bg-silver shadow-win95-inset flex items-center gap-2 text-xs min-w-[80px] justify-end">
            <span id="clock">12:00 PM</span>
        </div>
    </footer>

    <script>
        // Start Menu Logic
        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('hidden');
            const btn = document.getElementById('start-btn');
            btn.classList.toggle('shadow-win95-inset');
            btn.classList.toggle('shadow-win95-outset');
        }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('start-menu');
            const btn = document.getElementById('start-btn');
            if (menu && !menu.contains(e.target) && !btn.contains(e.target) && !menu.classList.contains('hidden')) {
                toggleStartMenu();
            }
        });

        function shutdown() {
            document.body.innerHTML = `
                <div class="h-screen w-screen bg-black flex items-center justify-center flex-col gap-4">
                    <div class="text-[#ff6600] font-bold text-2xl" style="font-family: 'Courier New', monospace;">It is now safe to turn off your computer.</div>
                    <div class="text-[#ff6600] text-sm" style="font-family: 'Courier New', monospace;">(现在可以安全地关闭浏览器了)</div>
                    <button onclick="window.close()" class="px-4 py-2 bg-silver text-black border-2 border-white shadow-win95-outset active:shadow-win95-inset cursor-pointer font-bold">关闭页面</button>
                </div>
            `;
            window.close();
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
